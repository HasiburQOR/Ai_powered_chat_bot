{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
  {# htmx swaps #widget-root's innerHTML between the pre-chat lead form and the chat panel #}
  <div id="widget-root" class="flex flex-col h-screen">
    {% if needs_details %}
      {% include "widget/partials/lead_form.html" %}
    {% else %}
      {% include "widget/partials/chat_panel.html" %}
    {% endif %}
  </div>

  <script>
    // Clear the input after each successful send, then keep the log scrolled down.
    document.body.addEventListener('htmx:afterRequest', function (e) {
      if (e.detail.elt.tagName === 'FORM') { e.detail.elt.reset(); }
      var log = document.getElementById('chat-log');
      if (log) { log.scrollTop = log.scrollHeight; }
    });
    var initialLog = document.getElementById('chat-log');
    if (initialLog) { initialLog.scrollTop = 1e9; }
  </script>
</body>
</html>
