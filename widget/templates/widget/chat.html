{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
  <header class="p-4 text-white font-semibold" style="background: {{ theme_color }}">
    {{ channel.name }}
  </header>

  <div id="chat-log"
       class="flex-1 overflow-y-auto p-4 space-y-2"
       hx-swap="beforeend">
    {% for message in messages %}
      {% if message.sender_type == "customer" %}
        <div class="flex justify-end"><div class="text-white rounded-2xl px-4 py-2 max-w-[80%]" style="background: {{ theme_color }}">{{ message.content }}</div></div>
      {% elif message.sender_type == "bot" %}
        <div class="flex justify-start"><div class="bg-white border rounded-2xl px-4 py-2 max-w-[80%]">{{ message.content }}</div></div>
      {% endif %}
    {% endfor %}
    <div class="flex justify-start"><div class="bg-white border rounded-2xl px-4 py-2 max-w-[80%]">{{ welcome_message }}</div></div>
  </div>

  <form hx-post="{% url 'widget-send' session_id %}"
        hx-target="#chat-log"
        hx-swap="beforeend"
        hx-indicator="#send-indicator"
        class="p-4 border-t bg-white flex gap-2">
    <input type="hidden" name="site_key" value="{{ site_key }}">
    <input type="text" name="message" autocomplete="off" required
           class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:ring-2"
           placeholder="Type your message…">
    <button type="submit" class="text-white rounded-full px-4 py-2 font-medium" style="background: {{ theme_color }}">Send</button>
  </form>

  <div id="send-indicator" class="htmx-indicator absolute bottom-20 right-8 text-sm text-gray-500">Bot is typing…</div>

  <script>
    // Clear the input after each successful send.
    document.body.addEventListener('htmx:afterRequest', function (e) {
      if (e.detail.elt.tagName === 'FORM') { e.detail.elt.reset(); }
      var log = document.getElementById('chat-log');
      log.scrollTop = log.scrollHeight;
    });
    document.getElementById('chat-log').scrollTop = 1e9;
  </script>
</body>
</html>
