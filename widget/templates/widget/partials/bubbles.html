{% if pair %}
  <div class="msg-row visitor"><div class="bubble visitor" style="background: {{ theme_color|default:'#4f46e5' }}">{{ inbound_text }}</div></div>
  <div class="msg-row bot"><div class="bubble bot">{{ reply.content }}</div></div>
{% else %}
  <div class="msg-row bot"><div class="bubble error">{{ error }}</div></div>
{% endif %}
