<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} — AI Chatbot Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 antialiased flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-500 flex items-center justify-center text-3xl shadow-lg shadow-indigo-500/20">🤖</div>
      <h1 class="mt-4 text-2xl font-extrabold tracking-tight text-white">Chatbot<span class="text-indigo-400 font-normal">Studio</span></h1>
      <p class="text-sm text-slate-400 mt-1">{% block subtitle %}{% endblock %}</p>
    </div>

    <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl shadow-xl p-7">
      {% if messages %}
        <div class="space-y-2 mb-5">
          {% for message in messages %}
            <div class="{% if message.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-300{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-300{% endif %} border rounded-xl px-4 py-2.5 text-sm font-medium">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>

    <p class="text-center text-xs text-slate-500 mt-6">Internal tool — authorized staff only.</p>
  </div>
</body>
</html>
