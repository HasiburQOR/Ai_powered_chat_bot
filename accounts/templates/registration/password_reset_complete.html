{% extends "registration/base_auth.html" %}
{% block title %}Password updated{% endblock %}
{% block subtitle %}Your password has been changed{% endblock %}

{% block content %}
  <div class="text-center">
    <div class="w-12 h-12 mx-auto rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-2xl mb-4">✅</div>
    <p class="text-sm text-slate-400 mb-6">Your password has been set successfully. You can sign in with it now.</p>
    <a href="{% url 'login' %}"
       class="inline-block rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-sm font-bold py-2.5 px-8 shadow-lg shadow-indigo-500/20 transition-all">
      Sign in
    </a>
  </div>
{% endblock %}
