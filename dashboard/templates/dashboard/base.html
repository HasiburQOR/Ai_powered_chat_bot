<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} — AI Chatbot Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900/5 min-h-screen text-slate-800 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <!-- Vibrant Top Navigation -->
  <nav class="bg-slate-900 border-b border-slate-800/80 sticky top-0 z-40 shadow-xl backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between gap-4 text-sm">
      <!-- Brand Logo -->
      <div class="flex items-center gap-6">
        <a href="{% url 'dashboard-home' %}" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-500 flex items-center justify-center text-white text-lg shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform duration-200">
            🤖
          </div>
          <span class="font-extrabold text-base tracking-tight text-white group-hover:text-indigo-300 transition-colors">
            Chatbot<span class="text-indigo-400 font-normal">Studio</span>
          </span>
        </a>

        <!-- Navigation Links -->
        <div class="hidden md:flex items-center gap-1.5 font-medium text-slate-300">
          <a href="{% url 'dashboard-home' %}" class="px-3 py-1.5 rounded-xl hover:text-white hover:bg-slate-800 transition-all">Home</a>
          <a href="{% url 'dashboard-llm-configs' %}" class="px-3 py-1.5 rounded-xl hover:text-white hover:bg-slate-800 transition-all">LLM Configs</a>
          <a href="{% url 'dashboard-chunks' %}" class="px-3 py-1.5 rounded-xl hover:text-white hover:bg-slate-800 transition-all">Knowledge</a>
          <a href="{% url 'dashboard-rules' %}" class="px-3 py-1.5 rounded-xl hover:text-white hover:bg-slate-800 transition-all">Rules</a>
          <a href="{% url 'dashboard-channels' %}" class="px-3 py-1.5 rounded-xl hover:text-white hover:bg-slate-800 transition-all">Channels</a>
          <a href="{% url 'dashboard-conversations' %}" class="px-3 py-1.5 rounded-xl hover:text-white hover:bg-slate-800 transition-all">Conversations</a>
          <a href="{% url 'dashboard-bot-settings' %}" class="px-3 py-1.5 rounded-xl hover:text-white hover:bg-slate-800 transition-all">Settings</a>
        </div>
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-3">
        <a href="{% url 'password_change' %}" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all flex items-center gap-1.5">
          <span>🔑</span> Change password
        </a>
        <a href="/admin/" target="_blank" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all flex items-center gap-1.5">
          <span>⚙️</span> Django Admin
        </a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/20 transition-all">
            Log out
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Main Workspace -->
  <main class="max-w-7xl mx-auto p-6 md:p-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Modal Container for HTMX Form Partials -->
  <div id="modal-container"></div>
</body>
</html>
