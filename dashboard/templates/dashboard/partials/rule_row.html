<tr id="rule-{{ rule.pk }}" class="hover:bg-slate-50/80 transition-colors">
  <td class="px-6 py-4">
    <span class="px-2.5 py-1 bg-amber-50 text-amber-800 font-bold border border-amber-200 rounded-lg text-xs font-mono">
      #{{ rule.priority }}
    </span>
  </td>
  <td class="px-6 py-4 font-bold text-slate-900">
    <div class="flex items-center gap-2">
      <span class="text-amber-500">🎯</span>
      <span>{{ rule.name }}</span>
    </div>
  </td>
  <td class="px-6 py-4 text-slate-600">
    <div class="flex flex-wrap gap-1">
      {% for kw in rule.trigger_keywords %}
        <span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded text-xs font-medium border border-slate-200">
          "{{ kw }}"
        </span>
      {% empty %}
        <span class="text-slate-400 text-xs italic">none</span>
      {% endfor %}
    </div>
  </td>
  <td class="px-6 py-4">
    {% if rule.short_circuits_llm %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-700 border border-amber-500/30">
        ⚡ Immediate Reply
      </span>
    {% else %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-500 border border-slate-200">
        🧠 Prompt Context
      </span>
    {% endif %}
  </td>
  <td class="px-6 py-4">
    {% if rule.is_active %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-700 border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Active
      </span>
    {% else %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-400 border border-slate-200">
        Inactive
      </span>
    {% endif %}
  </td>
  <td class="px-6 py-4 text-right whitespace-nowrap">
    <div class="inline-flex items-center gap-2">
      <button hx-get="{% url 'dashboard-rule-edit' rule.pk %}" hx-target="#modal-container"
              class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 font-semibold border border-amber-200 rounded-xl text-xs transition-all cursor-pointer">
        Edit
      </button>
      <button hx-post="{% url 'dashboard-rule-delete' rule.pk %}" hx-target="closest tr" hx-swap="outerHTML"
              hx-confirm="Are you sure you want to delete this rule?"
              class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold border border-rose-200 rounded-xl text-xs transition-all cursor-pointer">
        Delete
      </button>
    </div>
  </td>
</tr>
