<tr id="chunk-{{ chunk.pk }}" class="hover:bg-slate-50/80 transition-colors">
  <td class="px-6 py-4 font-bold text-slate-900">
    <div class="flex items-center gap-2">
      <span class="text-violet-500">📖</span>
      <span>{{ chunk.title }}</span>
    </div>
    {% if chunk.category %}
      <span class="inline-block mt-1 px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[11px] font-semibold border border-slate-200">
        {{ chunk.category }}
      </span>
    {% endif %}
  </td>
  <td class="px-6 py-4">
    {% if chunk.is_active %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-700 border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Active
      </span>
    {% else %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-400 border border-slate-200">
        Inactive
      </span>
    {% endif %}
  </td>
  <td class="px-6 py-4">
    {% if chunk.embedding %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-violet-50 text-violet-700 border border-violet-200">
        ✨ 384-dim Vectorized
      </span>
    {% else %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-600 border border-amber-200">
        ⏳ Pending Worker
      </span>
    {% endif %}
  </td>
  <td class="px-6 py-4 text-xs text-slate-500 font-mono">
    {{ chunk.updated_at|date:"Y-m-d H:i" }}
  </td>
  <td class="px-6 py-4 text-right whitespace-nowrap">
    <div class="inline-flex items-center gap-2">
      <button hx-get="{% url 'dashboard-chunk-edit' chunk.pk %}" hx-target="#modal-container"
              class="px-3 py-1.5 bg-violet-50 hover:bg-violet-100 text-violet-700 font-semibold border border-violet-200 rounded-xl text-xs transition-all cursor-pointer">
        Edit
      </button>
      <button hx-post="{% url 'dashboard-chunk-delete' chunk.pk %}" hx-target="closest tr" hx-swap="outerHTML"
              hx-confirm="Are you sure you want to delete this chunk?"
              class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold border border-rose-200 rounded-xl text-xs transition-all cursor-pointer">
        Delete
      </button>
    </div>
  </td>
</tr>
