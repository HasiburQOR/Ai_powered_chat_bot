<tr id="llm-config-{{ config.pk }}" class="hover:bg-slate-50/80 transition-colors">
  <td class="px-6 py-4 font-bold text-slate-900 flex items-center gap-2">
    <span class="text-indigo-500">⚡</span>
    <span>{{ config.name }}</span>
  </td>
  <td class="px-6 py-4 text-slate-700">
    <span class="px-2.5 py-1 bg-slate-100 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700">
      {{ config.get_provider_display }}
    </span>
  </td>
  <td class="px-6 py-4">
    <code class="px-2.5 py-1 bg-indigo-50/80 text-indigo-700 border border-indigo-100 rounded-lg text-xs font-mono font-semibold">
      {{ config.model_name }}
    </code>
  </td>
  <td class="px-6 py-4">
    {% if config.is_active %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-700 border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Active
      </span>
    {% else %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-400 border border-slate-200">
        Inactive
      </span>
    {% endif %}
  </td>
  <td class="px-6 py-4 text-right whitespace-nowrap">
    <div class="inline-flex items-center gap-2">
      {% if not config.is_active %}
        <button hx-post="{% url 'dashboard-llm-config-activate' config.pk %}" hx-target="#llm-config-tbody" hx-swap="innerHTML"
                class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold border border-emerald-200 rounded-xl text-xs transition-all cursor-pointer">
          Activate
        </button>
      {% endif %}
      <button hx-get="{% url 'dashboard-llm-config-edit' config.pk %}" hx-target="#modal-container"
              class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold border border-indigo-200 rounded-xl text-xs transition-all cursor-pointer">
        Edit
      </button>
      <button hx-post="{% url 'dashboard-llm-config-delete' config.pk %}" hx-target="closest tr" hx-swap="outerHTML"
              hx-confirm="Are you sure you want to delete this config?"
              class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold border border-rose-200 rounded-xl text-xs transition-all cursor-pointer">
        Delete
      </button>
    </div>
  </td>
</tr>
