<tr id="channel-{{ channel.pk }}" class="hover:bg-slate-50/80 transition-colors">
  <td class="px-6 py-4 font-bold text-slate-900 flex items-center gap-2">
    {% if channel.channel_type == 'instagram' %}
      <span class="text-pink-500 text-base">📸</span>
    {% elif channel.channel_type == 'messenger' %}
      <span class="text-blue-500 text-base">💬</span>
    {% else %}
      <span class="text-indigo-500 text-base">🌐</span>
    {% endif %}
    <span>{{ channel.name }}</span>
  </td>
  <td class="px-6 py-4">
    <span class="px-2.5 py-1 bg-slate-100 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 capitalize">
      {{ channel.get_channel_type_display }}
    </span>
  </td>
  <td class="px-6 py-4">
    {% if channel.is_active %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-700 border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Active
      </span>
    {% else %}
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-400 border border-slate-200">
        Inactive (Soft Deleted)
      </span>
    {% endif %}
  </td>
  <td class="px-6 py-4 text-right whitespace-nowrap">
    <div class="inline-flex items-center gap-2">
      <button hx-get="{% url 'dashboard-channel-edit' channel.pk %}" hx-target="#modal-container"
              class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-semibold border border-emerald-200 rounded-xl text-xs transition-all cursor-pointer">
        Edit Credentials
      </button>
      {% if channel.is_active %}
        <button hx-post="{% url 'dashboard-channel-deactivate' channel.pk %}" hx-target="closest tr" hx-swap="outerHTML"
                hx-confirm="Deactivate this channel? Existing conversations will be preserved."
                class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold border border-rose-200 rounded-xl text-xs transition-all cursor-pointer">
          Deactivate
        </button>
      {% endif %}
    </div>
  </td>
</tr>
